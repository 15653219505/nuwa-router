<!DOCTYPE html>
<html lang="zh-CN">

<script>window.__NUWA_STANDALONE__=true</script><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColorMeta" content="#f5efe0">
<!-- 允许「添加到主屏幕」后以独立窗口打开；不覆盖 status-bar-style，
     否则浅色主题下状态栏文字会看不清 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<!-- 内联 SVG 图标：避免每次加载都 404 一次 favicon，同时让标签页/主屏幕图标是「女」 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23bd7711'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%231a1200'%3E%E5%A5%B3%3C/text%3E%3C/svg%3E">
<title>女娲路由 · Nuwa Perspective Router</title>
<style>
  /* ============================================================
     设计令牌。所有颜色都收拢在这里，两套主题只是换一组取值。
     命名沿用原有的 --gold/--gold2/--fg 等，避免大面积改动选择器。
     --gold  = 结构强调色（边框、焦点环、引用线）
     --gold2 = 该主题下**文字级**强调色（浅色主题更深、深色主题更亮，都为了对比度）
     ============================================================ */
  :root{
    /* ---------- 白天：米黄 ---------- */
    --bg:#f5efe0;        /* 页面底色 */
    --bg2:#fffdf7;       /* 面板 / 卡片面 */
    --bg3:#efe7d4;       /* 输入框 / 浮起面 */
    --hover:#e9dfc7;     /* 悬停面 */
    --sel:#e9dcb9;       /* 选中项底色 */
    --line:#e3d9c1;      /* 常规描边 */
    --line2:#cdbd9c;     /* 强描边 / 滚动条 */
    --fg:#33301f;        /* 主文字（强对比） */
    --fg2:#5d5440;       /* 次文字 */
    --fg3:#7c7259;       /* 弱文字 / 标签 */
    --strong:#241f12;    /* 正文加粗 */
    --gold:#a9761a;      /* 结构强调 */
    --gold2:#7d5610;     /* 文字强调 */
    --jade:#2b7355;      /* 成功 / 高置信 */
    --red:#a83a38;       /* 错误 / 危险 */
    --blue:#2a6ba0;      /* 链接 */
    --hair:#dcd0b0;      /* 滚动条滑块 */
    --overlay:rgba(58,48,28,.42);
    --shadow:0 10px 30px rgba(84,66,28,.13);
    /* 金色品牌件：两套主题一致，保证品牌感稳定。
       取值经过对比度核算：--gold-ink 在渐变最暗端 --gold-g2 上仍达 5.2:1（WCAG AA）。 */
    --gold-g1:#e2c063; --gold-g2:#bd7711; --gold-ink:#1a1200;
    /* 正文里的各类面 */
    --u-bub1:#f3e7c8; --u-bub2:#ebddb6; --u-bub-b:#dcc99b;   /* 用户气泡 */
    --card1:#fdf8ea; --card2:#f8f1dd; --card-b:#dfcda4;      /* 路由卡片 */
    --pick-bg:#f3e9d0; --pick-b:#dfcda4;                     /* 技能芯片 */
    --code-bg:#f2e8d1; --code-b:#ded0ab; --code-fg:#7d5610;  /* 行内代码 */
    --pre-bg:#f4eeda; --pre-fg:#443d2c;                      /* 代码块 */
    --th-bg:#eee3c7; --tr-alt:#fbf6e9;                       /* 表头 / 隔行 */
    --ok-bg:#e2efe7; --ok-b:#a5c9b6;
    --bad-bg:#fbe8e5; --bad-b:#e5bdb5;
    --note:#8a5a10;                                          /* 边界提示 */
    --radius:10px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  /* ---------- 夜晚：暖黑 + 金 ---------- */
  :root[data-theme="dark"]{
    --bg:#15120c;
    --bg2:#1d1913;
    --bg3:#262016;
    --hover:#2e2718;
    --sel:#332a18;
    --line:#3a3222;
    --line2:#4c4129;
    --fg:#eee6d4;
    --fg2:#b8ad94;
    --fg3:#8a806a;
    --strong:#fff8e8;
    --gold:#dcb654;
    --gold2:#e9c96e;
    --jade:#6cc79e;
    --red:#e2908c;
    --blue:#7fb9ea;
    --hair:#3a3223;
    --overlay:rgba(0,0,0,.64);
    --shadow:0 10px 30px rgba(0,0,0,.46);
    --u-bub1:#332a19; --u-bub2:#2a2214; --u-bub-b:#4a3d24;
    --card1:#221d12; --card2:#1b1710; --card-b:#463a22;
    --pick-bg:#272114; --pick-b:#463a22;
    --code-bg:#262017; --code-b:#40361f; --code-fg:#e0c07a;
    --pre-bg:#100e09; --pre-fg:#d8cfba;
    --th-bg:#262017; --tr-alt:#1a1710;
    --ok-bg:#1c2e26; --ok-b:#2f5a48;
    --bad-bg:#2e1b19; --bad-b:#5a322c;
    --note:#d9a441;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--fg);font-family:var(--font);
    font-size:14px;line-height:1.65;overflow:hidden;overscroll-behavior:none;
    transition:background-color .25s ease, color .25s ease;
  }
  /* 触控设备去掉 300ms 点击延迟与双指缩放误触 */
  button,.chip,.skill,.rec,.hbtn,.pick,a{touch-action:manipulation}
  .scrim{position:fixed;inset:0;background:var(--overlay);z-index:55;display:none}
  /* 切主题时让面层一起过渡；只加在这些大面上，避免干扰 .skill/.rec 自己的悬停过渡 */
  header,footer,aside,.modal,.msg.bot .bubble,.route,.md pre,.md th,.md tr:nth-child(even) td{
    transition:background-color .25s ease, border-color .25s ease;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
  input,select,textarea{font-family:inherit;font-size:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--hair);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:var(--line2)}

  /* ---------- 布局 ---------- */
  /* 三档高度：老浏览器 100vh → 支持 dvh 的用 dvh（避开移动端地址栏伸缩）
     → 键盘弹出时由 JS 用 visualViewport 写入 --app-h 精确对齐 */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;height:var(--app-h,100dvh)}
  header{
    display:flex;align-items:center;gap:14px;padding:10px 18px;
    border-bottom:1px solid var(--line);background:var(--bg2);flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  .brand .glyph{
    width:26px;height:26px;border-radius:7px;flex-shrink:0;
    background:linear-gradient(135deg,var(--gold-g1),var(--gold-g2));
    display:grid;place-items:center;font-size:15px;color:var(--gold-ink);
  }
  .brand small{color:var(--fg3);font-weight:400;font-size:12px}
  header .spacer{flex:1}
  .hbtn{
    padding:6px 13px;border-radius:7px;border:1px solid var(--line);
    background:var(--bg3);color:var(--fg2);font-size:13px;transition:.15s;
    white-space:nowrap;
  }
  .hbtn:hover{background:var(--hover);color:var(--fg);border-color:var(--line2)}
  .hbtn.primary{background:linear-gradient(135deg,var(--gold-g1),var(--gold-g2));color:var(--gold-ink);border-color:transparent;font-weight:600}
  .hbtn.primary:hover{filter:brightness(1.06)}

  main{flex:1;display:flex;min-height:0}

  /* ---------- 侧栏公共 ---------- */
  aside{
    background:var(--bg2);display:flex;flex-direction:column;min-height:0;
  }
  aside.skills-pane{width:300px;flex-shrink:0;border-right:1px solid var(--line)}
  aside.history{width:252px;flex-shrink:0;border-left:1px solid var(--line)}

  .pane-head{
    padding:12px 15px;border-bottom:1px solid var(--line);
    font-size:12px;color:var(--fg3);letter-spacing:.6px;text-transform:uppercase;
    display:flex;align-items:center;justify-content:space-between;
  }
  .pane-head .count{color:var(--gold);font-weight:600}
  .skills{overflow-y:auto;flex:1;padding:8px}
  .skill{
    padding:9px 11px;border-radius:8px;cursor:pointer;margin-bottom:3px;
    border:1px solid transparent;transition:.12s;
  }
  .skill:hover{background:var(--bg3)}
  .skill.on{background:var(--sel);border-color:var(--gold);box-shadow:inset 2px 0 0 var(--gold)}
  .skill .row1{display:flex;align-items:center;gap:7px}
  .skill .ico{font-size:14px;width:17px;text-align:center;flex-shrink:0}
  .skill .nm{font-weight:600;font-size:13.5px}
  .skill .grp{margin-left:auto;font-size:10.5px;color:var(--fg3);white-space:nowrap}
  .skill .desc{font-size:11.5px;color:var(--fg3);margin-top:2px;padding-left:24px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lockhint{font-size:10.5px;color:var(--gold);padding-left:24px;margin-top:2px}
  .skill .info{
    margin-left:4px;color:var(--fg3);font-size:13px;line-height:1;
    padding:1px 5px;border-radius:5px;flex-shrink:0;
  }
  .skill .info:hover{background:var(--hover);color:var(--gold2)}
  .skill .grp{margin-left:auto}
  .skill .info{margin-left:6px}

  /* ---------- 中间对话 ---------- */
  section.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  #scroll{flex:1;overflow-y:auto;padding:24px 0}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px}

  .welcome{text-align:center;padding:48px 24px 24px;color:var(--fg2)}
  .welcome .big{font-size:22px;color:var(--fg);margin-bottom:6px;font-weight:600}
  .welcome .sub{font-size:13px;color:var(--fg3);margin-bottom:26px}
  .flow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:26px}
  .step{
    background:var(--bg2);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;font-size:12px;color:var(--fg2);text-align:left;min-width:130px;
  }
  .step b{display:block;color:var(--gold2);font-size:11px;margin-bottom:3px;letter-spacing:.5px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px;margin:0 auto}
  .chip{
    padding:7px 13px;border-radius:16px;border:1px solid var(--line);
    background:var(--bg2);color:var(--fg2);font-size:12.5px;transition:.15s;
  }
  .chip:hover{border-color:var(--gold);color:var(--gold2)}

  .msg{margin-bottom:22px}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--u-bub1),var(--u-bub2));
    border:1px solid var(--u-bub-b);border-radius:12px 12px 3px 12px;
    padding:10px 15px;max-width:82%;white-space:pre-wrap;word-break:break-word;
  }
  .msg.bot .bubble{
    background:var(--bg2);border:1px solid var(--line);border-radius:12px 12px 12px 3px;
    padding:14px 18px;word-break:break-word;
  }

  /* 路由卡片 */
  .route{
    border:1px solid var(--card-b);background:linear-gradient(180deg,var(--card1),var(--card2));
    border-radius:10px;padding:11px 14px;margin-bottom:9px;font-size:12.5px;
  }
  .route .rh{display:flex;align-items:center;gap:8px;color:var(--gold2);font-weight:600;font-size:12px;letter-spacing:.4px}
  .route .ptype{
    margin-left:auto;font-weight:400;color:var(--fg3);font-size:11px;
    border:1px solid var(--line);border-radius:10px;padding:1px 8px;
  }
  .route .picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pick{
    display:flex;align-items:center;gap:6px;background:var(--pick-bg);border:1px solid var(--pick-b);
    border-radius:7px;padding:4px 10px;font-size:12px;
  }
  .pick .cf{color:var(--jade);font-size:10.5px;font-variant-numeric:tabular-nums}
  .route .why{color:var(--fg2);margin-top:8px;font-size:12px;line-height:1.55}
  .route .why b{color:var(--fg)}
  .route .note{
    color:var(--note);margin-top:7px;font-size:11.5px;
    border-left:2px solid var(--gold);padding-left:9px;
  }
  .spin{
    display:inline-block;width:11px;height:11px;border:2px solid var(--pick-b);
    border-top-color:var(--gold2);border-radius:50%;animation:sp .7s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{
    border:1px solid var(--bad-b);background:var(--bad-bg);border-radius:9px;padding:11px 14px;
    color:var(--red);font-size:12.5px;margin-bottom:9px;
  }
  .err b{color:var(--red)}

  /* markdown */
  .md h1,.md h2,.md h3{margin:16px 0 7px;line-height:1.35;font-weight:600}
  .md h1{font-size:19px}
  .md h2{font-size:16.5px;color:var(--gold2)}
  .md h3{font-size:14.5px}
  .md h1:first-child,.md h2:first-child,.md h3:first-child{margin-top:0}
  .md p{margin:8px 0}
  .md ul,.md ol{margin:8px 0 8px 21px}
  .md li{margin:3px 0}
  .md li>p{margin:2px 0}
  .md code{
    background:var(--code-bg);border:1px solid var(--code-b);border-radius:4px;
    padding:1px 5px;font-size:12.5px;font-family:ui-monospace,Consolas,Monaco,monospace;color:var(--code-fg);
  }
  .md pre{
    background:var(--pre-bg);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;overflow-x:auto;margin:10px 0;
  }
  .md pre code{background:none;border:none;padding:0;color:var(--pre-fg);font-size:12.5px;line-height:1.55}
  .md blockquote{
    border-left:3px solid var(--gold);padding:3px 0 3px 13px;
    margin:10px 0;color:var(--fg2);font-style:normal;
  }
  .md table{border-collapse:collapse;margin:11px 0;font-size:12.5px;width:100%;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:6px 11px;text-align:left;vertical-align:top}
  .md th{background:var(--th-bg);color:var(--gold2);font-weight:600;white-space:nowrap}
  .md tr:nth-child(even) td{background:var(--tr-alt)}
  .md a{color:var(--blue);text-decoration:none}
  .md a:hover{text-decoration:underline}
  .md hr{border:none;border-top:1px solid var(--line);margin:16px 0}
  .md strong{color:var(--strong);font-weight:600}

  /* ---------- 输入区 ---------- */
  footer{border-top:1px solid var(--line);background:var(--bg2);padding:12px 0 14px;flex-shrink:0}
  .inputbox{
    max-width:820px;margin:0 auto;padding:0 24px;display:flex;gap:10px;align-items:flex-end;
  }
  #q{
    flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
    color:var(--fg);padding:11px 14px;resize:none;max-height:170px;min-height:44px;
    line-height:1.6;outline:none;transition:border-color .15s;
  }
  #q:focus{border-color:var(--gold)}
  #q::placeholder{color:var(--fg3)}
  #send{
    background:linear-gradient(135deg,var(--gold-g1),var(--gold-g2));color:var(--gold-ink);
    border-radius:10px;padding:0 20px;height:44px;font-weight:600;flex-shrink:0;transition:.15s;
  }
  #send:hover:not(:disabled){filter:brightness(1.12)}
  #send:disabled{opacity:.4;cursor:not-allowed}
  .inputmeta{
    max-width:820px;margin:7px auto 0;padding:0 24px;
    display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg3);
  }
  .inputmeta label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .inputmeta input[type=checkbox]{accent-color:var(--gold);cursor:pointer}

  /* ---------- 设置弹层 ---------- */
  .overlay{
    position:fixed;inset:0;background:var(--overlay);display:none;
    place-items:center;z-index:50;backdrop-filter:blur(3px);padding:20px;
  }
  .overlay.on{display:grid}
  .modal{
    background:var(--bg2);border:1px solid var(--line);border-radius:14px;
    width:min(540px,100%);max-height:88vh;overflow-y:auto;padding:24px 26px;
  }
  .modal h2{font-size:17px;margin-bottom:4px}
  .modal .hint{font-size:12px;color:var(--fg3);margin-bottom:20px;line-height:1.6}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;color:var(--fg2);margin-bottom:6px;font-weight:500}
  .field label span{color:var(--fg3);font-weight:400}
  .field input,.field select{
    width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;
    color:var(--fg);padding:9px 12px;outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--gold)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal .actions{display:flex;gap:9px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
  /* 诊断输出：等宽字体、可滚、默认隐藏 */
  .diagout{
    display:none;margin-top:16px;padding:11px 13px;border:1px solid var(--line);
    border-radius:8px;background:var(--pre-bg);color:var(--pre-fg);
    font-size:11.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
    max-height:240px;overflow:auto;
    font-family:ui-monospace,Consolas,Monaco,monospace;
  }
  .diagout.on{display:block}
  .status{font-size:12px;margin-right:auto;align-self:center;color:var(--fg3)}
  .status.ok{color:var(--jade)}
  .status.bad{color:var(--red)}

  /* ---------- 技能详情弹层 ---------- */
  .prof h3{font-size:15px;color:var(--gold2);margin:17px 0 7px}
  .prof h3:first-of-type{margin-top:14px}
  .prof .tags{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}
  .tag{
    font-size:11.5px;border-radius:6px;padding:2px 9px;
    background:var(--pick-bg);border:1px solid var(--pick-b);color:var(--fg2);
  }
  .tag.good{background:var(--ok-bg);border-color:var(--ok-b);color:var(--jade)}
  .tag.bad{background:var(--bad-bg);border-color:var(--bad-b);color:var(--red)}
  .prof ul{margin:6px 0 6px 20px;font-size:13px}
  .prof li{margin:4px 0}
  .prof .flowline{font-size:12.5px;color:var(--fg2);background:var(--bg3);
    border-left:2px solid var(--gold);padding:9px 13px;border-radius:0 7px 7px 0;margin:9px 0}
  .cutoff{font-size:11.5px;color:var(--fg3);margin-top:14px;border-top:1px solid var(--line);padding-top:11px}

  /* ---------- 右侧历史记录 ---------- */
  .histlist{overflow-y:auto;flex:1;padding:8px}
  .rec{
    padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px;
    border:1px solid transparent;transition:.12s;position:relative;
  }
  .rec:hover{background:var(--bg3)}
  .rec.on{background:var(--sel);border-color:var(--gold)}
  .rec .rq{
    font-size:12.5px;font-weight:600;line-height:1.4;padding-right:16px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .rec .rm{font-size:10.5px;color:var(--fg3);margin-top:4px;display:flex;align-items:center;gap:6px}
  .rec .rskills{color:var(--gold2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec .del{
    position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:5px;
    display:none;place-items:center;font-size:13px;line-height:1;color:var(--fg3);
  }
  .rec:hover .del{display:grid}
  .rec .del:hover{background:var(--bad-bg);color:var(--red)}

  /* 删除确认气泡：跟随点击位置出现在光标右侧，位置由 JS 夹回视口内 */
  .confirmpop{
    position:fixed;left:0;top:0;z-index:70;
    display:none;align-items:center;gap:7px;
    padding:6px 8px;border-radius:9px;
    border:1px solid var(--line2);background:var(--bg2);
    box-shadow:var(--shadow);white-space:nowrap;font-size:12px;
  }
  .confirmpop.on{display:flex}
  .confirmpop .cptext{color:var(--fg2);padding-left:3px}
  .histlist .empty{color:var(--fg3);font-size:12px;text-align:center;padding:28px 14px;line-height:1.8}
  .histfoot{padding:8px;border-top:1px solid var(--line)}

/* 主题引导：必须在首次绘制前定好 data-theme，否则深色系统下会先闪一下白。
   逻辑与页面里的 applyTheme() 保持一致（pref: auto | light | dark）。 */
(function () {
  var pref = 'auto'
  try { pref = localStorage.getItem('nuwa.theme') || 'auto' } catch (e) {}
  var dark = pref === 'dark' ||
    (pref === 'auto' && window.matchMedia &&
     window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
  // 顺手把浏览器地址栏 / 状态栏颜色也定好（此时 <style> 已解析，能读到令牌）
  try {
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()
    var meta = document.getElementById('themeColorMeta')
    if (bg && meta) meta.setAttribute('content', bg)
  } catch (e) {}
})()
</script>

  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+codes[i]+'</code>');
  return s;
}
function md(src){
  const lines = String(src||'').replace(/\r/g,'').split('\n');
  let out='', i=0;
  const isTableSep = s => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(s) && s.includes('-');
  while(i<lines.length){
    let L = lines[i];
    // 代码块
    if(/^\s*```/.test(L)){
      const body=[]; i++;
      while(i<lines.length && !/^\s*```/.test(lines[i])){body.push(lines[i]);i++}
      i++;
      out+='<pre><code>'+esc(body.join('\n'))+'</code></pre>';
      continue;
    }
    // 表格
    if(L.includes('|') && i+1<lines.length && isTableSep(lines[i+1])){
      const cells = r => r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
      const head = cells(L); i+=2;
      let t='<table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>';
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()!==''){
        t+='<tr>'+cells(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
        i++;
      }
      out+=t+'</tbody></table>';
      continue;
    }
    // 标题
    let m = L.match(/^(#{1,4})\s+(.*)$/);
    if(m){ const lv=Math.min(m[1].length,3); out+='<h'+lv+'>'+inline(m[2])+'</h'+lv+'>'; i++; continue; }
    // 分隔线
    if(/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(L)){ out+='<hr>'; i++; continue; }
    // 引用
    if(/^\s*>/.test(L)){
      const body=[];
      while(i<lines.length && /^\s*>/.test(lines[i])){ body.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out+='<blockquote>'+md(body.join('\n'))+'</blockquote>';
      continue;
    }
    // 列表
    if(/^\s*([-*+]|\d+\.)\s+/.test(L)){
      const ord = /^\s*\d+\./.test(L);
      let t = ord?'<ol>':'<ul>';
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        t += '<li>'+inline(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,''))+'</li>';
        i++;
      }
      out += t+(ord?'</ol>':'</ul>');
      continue;
    }
    // 空行
    if(L.trim()===''){ i++; continue; }
    // 段落
    const para=[];
    while(i<lines.length && lines[i].trim()!=='' &&
          !/^\s*(#{1,4}\s|>|```|([-*+]|\d+\.)\s)/.test(lines[i]) &&
          !(lines[i].includes('|') && i+1<lines.length && isTableSep(lines[i+1]))){
      para.push(lines[i]); i++;
    }
    out += '<p>'+inline(para.join('\n')).replace(/\n/g,'<br>')+'</p>';
  }
  return out;
}

function endpoint(){
  let b = (S.baseUrl||'').trim().replace(/\/+$/,'');
  if(!/\/v\d+$/.test(b) && !/\/chat\/completions$/.test(b)) b += '/v1';
  return b + '/chat/completions';
}
/* 把 HTTP 错误和网络错误区分开：前者是服务器明确回话（401/402/429…），后者是
   请求根本没送出去。混在一起会把"Key 错了"误报成"网络被拒"，白白排查半天。 */
async function httpError(res){
  let detail = '';
  try{ detail = String(await res.text() || '').slice(0, 300); }catch(e){}
  const err = new Error('HTTP ' + res.status + ' ' + (res.statusText || '') + (detail ? ' — ' + detail : ''));
  err.isHttp = true;
  return err;
}

/** 一次性（非流式）请求。 */
async function complete(messages, temperature){
  const res = await fetch(endpoint(), {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},
    body: JSON.stringify({ model: S.model, messages, temperature, stream:false })
  });
  if(!res.ok) throw await httpError(res);
  const j = await res.json();
  return j.choices?.[0]?.message?.content || '';
}

/** 流式请求。onDelta(delta, full) 每收到一段就回调。 */
async function streamComplete(messages, temperature, onDelta){
  const res = await fetch(endpoint(), {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},
    body: JSON.stringify({ model: S.model, messages, temperature, stream:true })
  });
  if(!res.ok) throw await httpError(res);
  if(!res.body || typeof res.body.getReader !== 'function'){
    throw new Error('该响应不支持流式读取（res.body 不可用）');
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', full = '';
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const parts = buf.split('\n'); buf = parts.pop();
    for(const line of parts){
      const t = line.trim();
      if(!t.startsWith('data:')) continue;
      const d = t.slice(5).trim();
      if(d === '[DONE]') continue;
      try{
        const j = JSON.parse(d);
        const delta = j.choices?.[0]?.delta?.content;
        if(delta){ full += delta; if(onDelta) onDelta(delta, full); }
      }catch(e){}
    }
  }
  return full;
}

/**
 * 统一入口，签名与原来一致，调用方不用改。
 *
 * 关键行为：流式失败且**还没吐出任何内容**时，自动退回一次性请求再试。
 * 有些网络路径会掐掉 SSE 长连接（代理缓冲、iOS 隐私中继、部分运营商），
 * 但普通 POST 是通的——不补这一步，用户就只看到一句"网络被拒绝"。
 * 已经出过字就不重试：否则内容会被推翻重来，还多花一次钱。
 */
async function llm(messages, {stream=false, onDelta, temperature}={}){
  if(!S.apiKey){ throw new Error('NO_KEY'); }
  const temp = temperature !== undefined ? temperature : Number(S.temp);
  if(!stream) return complete(messages, temp);

  let received = false;
  try{
    return await streamComplete(messages, temp, (delta, full)=>{
      received = true;
      if(onDelta) onDelta(delta, full);
    });
  }catch(e){
    if(received || e.isHttp) throw e;   // 服务器已明确回话，或内容已出，不重试
    console.warn('[nuwa] 流式失败，回退为一次性请求：', e);
    const full = await complete(messages, temp);
    if(onDelta) onDelta(full, full);
    return full;
  }
}

const ROUTER_SYS = `你是「女娲」(huashu-nuwa) 的路由器。

女娲的方法论：蒸馏的不是"一个人说了什么"，而是"他怎么想"——每个技能是一套可运行的认知操作系统（心智模型 + 决策启发式 + 表达 DNA + 反模式 + 诚实边界）。

你的唯一任务：分析用户的问题，从技能库中选出最合适的 1–3 个技能（大多数情况只选 1 个；只有当问题明确跨域、且单一框架会漏掉关键维度时才选 2–3 个），并说明理由。

   例：用芒格分析 AI 技术路线是错的（他的科技盲区是结构性的）；用马斯克分析公关危机是错的（他在这类领域系统性失效）；用张雪峰给家境优越、想读博的人做规划是错的。

【输出格式】只输出一个 JSON 对象，不要任何解释、不要 markdown 代码围栏：
{

  "why": "两三句话：这个问题的本质是什么，为什么这个/这些框架能解决它",
  "note": "如果存在边界风险、时效性风险或没有完全对口框架，在这里说明；没有则留空字符串"
}

【技能库】
${kbBrief()}`;

async function route(question){
  const raw = await llm(
    [{role:'system',content:ROUTER_SYS},{role:'user',content:question}],
    {stream:false, temperature:0.1}
  );
  let txt = String(raw).trim();
  txt = txt.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if(a>=0 && b>a) txt = txt.slice(a,b+1);
  let obj;
  try{ obj = JSON.parse(txt); }
  catch(e){ throw new Error('路由解析失败，模型返回：'+String(raw).slice(0,300)); }
  if(!Array.isArray(obj.picks)) obj.picks = [];
  obj.picks = obj.picks.filter(p=>p && KB.some(k=>k.id===p.id)).slice(0,3);
  if(!obj.picks.length) obj.picks = [{id:'feynman',confidence:0.3,why:'路由未命中，回退到通用思维拆解'}];
  return obj;
}

/* =========================== 发送主流程 =========================== */
async function send(){
  if(busy) return;
  const q = $('#q').value.trim();
  if(!q) return;
  if(!S.apiKey){ openSettings(); $('#testStatus').textContent='请先填写 API Key'; $('#testStatus').className='status bad'; return; }

  busy = true; $('#send').disabled = true;
  $('#q').value=''; $('#q').style.height='auto';
  if($('#stream').querySelector('.welcome')) $('#stream').innerHTML='';

  addMsg('user', esc(q).replace(/\n/g,'<br>'), 'user');
  const shell = botShell();
  const showRoute = $('#showRoute').checked;
  if(!showRoute) shell.route.style.display='none';
  toBottom();

  let picks, routeObj;
  try{
    if(locked){
      const k = KB.find(x=>x.id===locked);
      routeObj = {problemType:'手动锁定', picks:[{id:k.id,confidence:1,why:'你手动锁定了这个技能'}],
                  why:`已手动锁定 **${k.name}**，跳过自动路由。`, note:''};
    } else {
      shell.route.innerHTML = routeCard({picks:[], why:'正在判断问题类型并匹配思维框架…'}, true);
      toBottom();
      routeObj = await route(q);
    }
    picks = routeObj.picks.map(p=>({...p, name: KB.find(k=>k.id===p.id).name}));
    shell.route.innerHTML = routeCard(routeObj, false);
    toBottom();
  }catch(e){
    busy=false; $('#send').disabled=false;
    shell.route.innerHTML='';
    shell.ans.outerHTML = `<div class="err"><b>路由失败：</b>${esc(errMsg(e))}</div>`;
    return;
  }

  // 组装上下文（最近 6 轮，用于理解指代）
  const msgs = [{role:'system', content: buildExecutorSys(picks)}];
  history.slice(-6).forEach(h=>{
    if(h.role==='user' || h.role==='assistant') msgs.push({role:h.role, content:h.content});
  });
  msgs.push({role:'user', content:q});

  let acc='';
  try{
    await llm(msgs, {stream:true, onDelta:(d, full)=>{
      acc = full; shell.ans.innerHTML = md(full); toBottom();
    }});
  }catch(e){
    shell.ans.innerHTML = `<div class="err"><b>生成失败：</b>${esc(errMsg(e))}</div>`;
    busy=false; $('#send').disabled=false; return;
  }

  history.push({role:'user', content:q});
  history.push({role:'assistant', content:acc});
  saveHistory();

  // 存进右侧历史栏
  const rec = {
    id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    ts: Date.now(),
    q: q,
    a: acc,
    route: routeObj,
    picks: picks.map(p => {
      const k = KB.find(x => x.id === p.id) || {};
      return { id: p.id, name: p.name, ico: k.ico || '' };
    }),
  };
  records.unshift(rec);
  if(records.length > 200) records.length = 200;
  activeId = rec.id;
  renderHistory();
  await histOp({op:'add', record: rec});
  renderHistory();

  busy=false; $('#send').disabled=false; $('#q').focus();
}

function errMsg(e){
  const name = (e && e.name) || '错误';
  const msg = String((e && e.message) || e);
  if(msg === 'NO_KEY') return '未填写 API Key，点击右上角「⚙ 设置」。';
  if(e && e.isHttp) return msg;   // 服务器明确回了状态码，直接展示，别加戏
  // 只有真正的网络层失败才给排查建议。之前这里把**所有** TypeError 都归成网络
  // 问题，连代码自己抛的异常也被伪装成"网络被拒绝"，等于把线索掐断了。
  if(/Failed to fetch|NetworkError|load failed|network error/i.test(name + ': ' + msg)){
    return '请求没能发到服务器。\n原始错误：' + name + ': ' + msg +
      '\n\n逐项排查（⚙ 设置 →「诊断」可自动检测）：\n' +
      '① 接口地址：' + (S.baseUrl || '(空)') + '\n' +
      '② 该地址是否允许浏览器直连（CORS）\n' +
      '③ 当前网络 / 代理是否拦截';
  }
  return name + ': ' + msg;
}

/**
 * 逐项诊断：把「请求到底卡在哪一步」一次问清楚。
 * 之前只有一句笼统的"网络被拒绝"，既分不清是地址错、CORS、还是流式被拦，
 * 也看不到真实异常。这个按钮把每一层的原始结果都摊开。
 */
async function diagnose(){
  const box = $('#diagOut');
  if(!box) return;
  const lines = [];
  const add = (s)=>{
    lines.push(s);
    box.textContent = lines.join('\n');
    box.classList.add('on');
    box.scrollTop = box.scrollHeight;
  };
  box.textContent = ''; box.classList.add('on');

  const bak = S; S = readForm();   // 用表单里的当前值诊断，不必先保存
  const restore = ()=>{ S = bak; };

  add('── 配置 ─────────────────────');
  add('接口地址 : ' + (S.baseUrl || '(空)'));
  add('实际 URL : ' + endpoint());
  add('模型     : ' + S.model);
  add('Key      : ' + (S.apiKey ? '已填（' + S.apiKey.length + ' 字符）' : '未填'));
  add('页面来源 : ' + location.origin);
  add('');

  add('── ① 跨域预检 ──────────────');
  try{
    const t0 = performance.now();
    const r = await fetch(endpoint(), {
      method:'OPTIONS',
      headers:{ 'Access-Control-Request-Method':'POST', 'Access-Control-Request-Headers':'authorization,content-type' }
    });
    add('HTTP ' + r.status + '，完成 ' + Math.round(performance.now()-t0) + 'ms');
    add('→ 请求能发出去且被服务器接受，CORS 没有拦（ACAO 头读不到是浏览器规定，正常）。');
  }catch(e){
    add('失败: ' + (e.name||'') + ': ' + (e.message||e));
    add('→ 请求根本没发出去：地址写错 / DNS 解析不了 / 网络被拦 / CORS 被拒。');
  }
  add('');

  add('── ② 非流式请求 ─────────────');
  try{
    const t0 = performance.now();
    const txt = await complete([{role:'user',content:'回复两个字：可用'}], 0);
    add('成功 (' + Math.round(performance.now()-t0) + 'ms) → ' + JSON.stringify(String(txt).trim().slice(0,40)));
  }catch(e){
    add('失败: ' + (e.name||'') + ': ' + (e.message||e));
  }
  add('');

  add('── ③ 流式请求 ───────────────');
  let n = 0;
  try{
    const t0 = performance.now();
    await streamComplete([{role:'user',content:'从1数到5'}], 0, ()=>{ n++; });
    add('成功 (' + Math.round(performance.now()-t0) + 'ms)，收到 ' + n + ' 个增量');
  }catch(e){
    add('失败: ' + (e.name||'') + ': ' + (e.message||e));
    add('→ 页面会自动退回非流式，功能仍可用（② 成功即代表能用）。');
  }
  add('');

  add('── 环境 ─────────────────────');
  add('流式读取支持: ' + (typeof ReadableStream !== 'undefined' ? '有' : '无'));
  add('User-Agent : ' + navigator.userAgent);
  add('');
  add('诊断完成。以上整段发给维护者即可定位。');
  restore();
}

/* ============ 右侧历史记录（localStorage 持久化） ============ */
/* 历史记录优先存宿主侧（/nuwa-history，落盘成 JSON 文件，换浏览器/清缓存都不丢）；
   接口不可用时自动回退到 localStorage。
   独立版（静态托管 / 可安装 PWA）没有宿主接口，由构建脚本注入
   window.__NUWA_STANDALONE__，直接走本机存储，省掉一次必然 404 的请求。 */
async function loadRecords(){
  if(!window.__NUWA_STANDALONE__){
    try{
      const r = await fetch(HIST_API, {headers:{'Accept':'application/json'}});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if(!Array.isArray(j.records)) throw new Error('返回格式不对');
      records = j.records.filter(x => x && x.id && typeof x.q === 'string');
      histMode = 'server';
      return;
    }catch(e){
      histMode = 'local';
    }
  }else{
    histMode = 'local';
  }
  try{
    const r = JSON.parse(localStorage.getItem(LS_R)||'[]');
    if(Array.isArray(r)) records = r.filter(x => x && x.id && typeof x.q === 'string');
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS_R, JSON.stringify(records.slice(0,200))); return; }
  catch(e){}
  // 配额超了：砍掉一半再试一次，避免静默丢数据（回复很长时容易触发）
  try{
    records = records.slice(0, Math.max(1, Math.floor(records.length/2)));
    localStorage.setItem(LS_R, JSON.stringify(records));
    console.warn('历史记录超出 localStorage 配额，已裁剪到 ' + records.length + ' 条');
  }catch(e2){
    console.error('历史记录写入失败', e2);
  }
}
/** 把一次操作发给宿主；失败则降级为本地存储。 */
async function histOp(op){
  if(histMode === 'server'){
    try{
      const r = await fetch(HIST_API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(op)
      });
      const j = await r.json().catch(()=>null);
      if(!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
      if(!Array.isArray(j.records)) throw new Error('返回格式不对');
      records = j.records;
      return;
    }catch(e){
      console.warn('宿主侧历史不可用，回退到 localStorage：', e.message || e);
      histMode = 'local';
      renderHistMode();
    }
  }
  saveLocal();
}
function renderHistMode(){
  const el = $('#histMode');
  if(!el) return;
  if(histMode === 'server'){
    el.textContent = '宿主侧';
    el.className = 'stor server';
    el.title = '历史存在宿主侧 JSON 文件里，换浏览器 / 清缓存都不会丢';
  }else{
    el.textContent = '本机';
    el.className = 'stor local';
    el.title = '宿主接口不可用，历史暂存在本浏览器的 localStorage';
  }
}
function fmtTime(ts){
  const d = new Date(ts), p = n => String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderHistory(){
  const box = $('#histList');
  if(!box) return;
  closeConfirm();   // 列表重绘时，任何待确认的删除都作废
  const c = $('#histCount'); if(c) c.textContent = records.length;
  if(!records.length){
    box.innerHTML = '<div class="empty">还没有历史记录。<br>提问一次就会自动存进这里。</div>';
    return;
  }
  box.innerHTML = records.map(r=>{
    const skills = (r.picks||[]).map(p=>esc(p.name)).join(' + ');
    return `<div class="rec ${activeId===r.id?'on':''}" data-id="${r.id}">
      <div class="rq">${esc(String(r.q).slice(0,90))}</div>
      <div class="rm"><span>${fmtTime(r.ts)}</span><span class="rskills">${skills||'—'}</span></div>
      <span class="del" data-del="${r.id}" title="删除这条">×</span>
    </div>`;
  }).join('');
  box.querySelectorAll('.rec').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.dataset && e.target.dataset.del) return;
      openRecord(el.dataset.id);
      autoCloseDrawers();
    };
  });
  box.querySelectorAll('.del').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); askDelete(el.dataset.del, e); };
  });
}
function openRecord(id){
  const r = records.find(x => x.id === id);
  if(!r) return;
  activeId = id;
  history = [{role:'user', content:r.q}, {role:'assistant', content:r.a}];
  $('#stream').innerHTML='';
  addMsg('user', esc(r.q).replace(/\n/g,'<br>'), 'user');
  const shell = botShell();
  if($('#showRoute').checked && r.route) shell.route.innerHTML = routeCard(r.route, false);
  else shell.route.style.display='none';
  shell.ans.innerHTML = md(r.a);
  renderHistory();
  toBottom();
}
async function deleteRecord(id){
  records = records.filter(x => x.id !== id);
  if(activeId === id) activeId = null;
  renderHistory();
  await histOp({op:'delete', id: id});
  renderHistory();
}

/* ---- 删除确认气泡 ----
   点 × 不直接删，先在光标旁弹一个「确认 / 取消」。
   优先放光标右侧；右侧放不下就翻到左侧 —— 历史栏本来就贴着屏幕右边缘，
   照字面摆"鼠标右侧"会直接顶出屏幕。键盘触发时（没有坐标）退回按钮位置。 */
function askDelete(id, ev){
  const pop = $('#confirmPop');
  if(!pop || !id) return;
  confirmFor = id;
  pop.classList.add('on');            // 先显示，才能量出真实尺寸

  const GAP = 12;
  let cx, cy;
  if(ev && typeof ev.clientX === 'number' && (ev.clientX || ev.clientY)){
    cx = ev.clientX; cy = ev.clientY;
  }else{
    const btn = document.querySelector('.rec .del[data-del="' + id + '"]');
    const r = btn ? btn.getBoundingClientRect() : { right: 24, top: 12, height: 18 };
    cx = r.right; cy = r.top + (r.height || 18) / 2;
  }

  const w = pop.offsetWidth, h = pop.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;

  let left = cx + GAP;
  if(left + w > vw - 6) left = cx - w - GAP;          // 右侧放不下 → 翻到左侧
  left = Math.max(6, Math.min(left, vw - w - 6));
  let top = cy - h / 2;                                // 垂直居中于光标
  top = Math.max(6, Math.min(top, vh - h - 6));

  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(top) + 'px';

  const yes = $('#cpYes');
  if(yes) yes.focus({ preventScroll: true });
}
function closeConfirm(){
  confirmFor = null;
  const pop = $('#confirmPop');
  if(pop) pop.classList.remove('on');
}
function confirmDelete(){
  const id = confirmFor;
  closeConfirm();
  if(id) deleteRecord(id);
}
async function clearHistory(){
  if(!records.length) return;
  if(!confirm('清空全部历史记录？此操作不可撤销（当前的 API 设置不受影响）。')) return;
  records = []; activeId = null;
  renderHistory();
  await histOp({op:'clear'});
  renderHistory();
}

/* =========================== 主题 =========================== */
const LS_T='nuwa.theme';   // auto | light | dark
function themePref(){
  try{ return localStorage.getItem(LS_T) || 'auto'; }catch(e){ return 'auto'; }
}
function systemDark(){
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
/** 让浏览器地址栏 / 状态栏颜色跟上当前主题。 */
function syncThemeColor(){
  const meta = document.getElementById('themeColorMeta');
  if(!meta) return;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if(bg) meta.setAttribute('content', bg);
}
/** 把偏好落到 <html data-theme>；auto 时跟随系统。 */
function applyTheme(){
  const pref = themePref();
  const dark = pref === 'dark' || (pref === 'auto' && systemDark());
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  syncThemeColor();
  const b = $('#themeBtn');
  if(b){
    const label = pref === 'auto' ? '跟随系统' : (pref === 'dark' ? '夜晚' : '白天');
    b.textContent = pref === 'auto' ? '🌗' : (pref === 'dark' ? '🌙' : '☀️');
    b.title = '主题：' + label + '（点击切换 跟随系统 → 白天 → 夜晚）';
    b.setAttribute('aria-label', b.title);
  }
}
function cycleTheme(){
  const order = ['auto','light','dark'];
  const next = order[(order.indexOf(themePref()) + 1) % order.length];
  try{ localStorage.setItem(LS_T, next); }catch(e){}
  applyTheme();
}

/* =========================== 移动端交互 =========================== */
/** 触屏设备（粗指针 + 无悬停）。决定 Enter 是发送还是换行。 */
function isTouch(){
  return !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
}
/** 窄视口：此时两侧栏是抽屉，而不是常驻列。 */
function isNarrow(){
  return !!(window.matchMedia && window.matchMedia('(max-width: 820px)').matches);
}
/** 收起两侧抽屉和遮罩。 */
function closeDrawers(){
  document.querySelectorAll('aside.skills-pane, aside.history').forEach(a => a.classList.remove('open'));
  const s = document.getElementById('scrim');
  if(s) s.classList.remove('on');
}
/** 开/关指定抽屉；打开时同时点亮遮罩，点遮罩即可关。 */
function toggleDrawer(sel){
  const el = document.querySelector(sel);
  if(!el) return;
  const willOpen = !el.classList.contains('open');
  closeDrawers();
  if(!willOpen) return;
  el.classList.add('open');
  const s = document.getElementById('scrim');
  if(s) s.classList.add('on');
}
/** 窄视口下选完东西自动收起抽屉，把屏幕还给对话区。 */
function autoCloseDrawers(){ if(isNarrow()) closeDrawers(); }

/* =========================== 启动 =========================== */
(async function init(){
  try{ const s = JSON.parse(localStorage.getItem(LS_S)||'null'); if(s&&typeof s==='object') S={...S,...s}; }catch(e){}
  loadHistory();
  await loadRecords();
  renderSkills(); updateLockBtn();
  $('#modelTag').textContent = S.model + ' · ' + S.baseUrl.replace(/^https?:\/\//,'');
  renderHistory();
  renderHistMode();
  applyTheme();
  replay();

  // 系统主题变化时，只要当前是「跟随系统」就同步刷新
  if(window.matchMedia){
    try{
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
        if(themePref() === 'auto') applyTheme();
      });
    }catch(e){}
  }

  $('#send').onclick = send;
  const ta = $('#q');
  ta.addEventListener('keydown', e=>{
    if(e.key !== 'Enter') return;
    // 中文输入法组合中：Enter 是选词，不是发送
    if(e.isComposing || e.keyCode === 229) return;
    // 触屏上 Enter 保持换行（手机键盘的 Enter 通常就是换行），发送交给按钮；
    // 但 Ctrl/Cmd+Enter 仍然发送，方便外接键盘
    if(isTouch() && !(e.ctrlKey || e.metaKey)) return;
    if(!e.shiftKey){ e.preventDefault(); send(); }
  });
  ta.addEventListener('input', ()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,170)+'px'; });

  // 视口变宽后抽屉不再适用，收起来免得遮罩挡住内容
  window.addEventListener('resize', ()=>{
    if(!isNarrow()) closeDrawers();
    updateLockBtn();   // 锁定按钮的文案随宽度变化
    closeConfirm();    // 位置按旧视口算的，作废
  });

  // 删除确认气泡的关闭路径：点别处 / Esc / 滚动列表
  // （× 自己的点击已 stopPropagation，不会一弹出就被这里关掉）
  document.addEventListener('click', (e)=>{
    const pop = $('#confirmPop');
    if(pop && pop.classList.contains('on') && !pop.contains(e.target)) closeConfirm();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){ closeConfirm(); closeDrawers(); }
  });
  const hl = $('#histList');
  if(hl) hl.addEventListener('scroll', closeConfirm, { passive: true });

  // 键盘弹出时用 visualViewport 精确对齐容器高度，否则输入框会被键盘挡在下面。
  // 只在触屏上启用，避免桌面端无谓的抖动。
  if(isTouch() && window.visualViewport){
    const vv = window.visualViewport;
    const sync = ()=> document.documentElement.style.setProperty('--app-h', Math.round(vv.height) + 'px');
    vv.addEventListener('resize', sync);
    vv.addEventListener('scroll', sync);
    sync();
  }
  $('#settingsOverlay').addEventListener('click', e=>{ if(e.target.id==='settingsOverlay') closeSettings(); });
  document.querySelectorAll('.overlay .modal').forEach(m=>m.addEventListener('click',e=>e.stopPropagation()));

  if(!S.apiKey){ setTimeout(()=>{ openSettings(); $('#testStatus').textContent='首次使用：请先填写 API Key'; }, 300); }
  ta.focus();
})();
</script>
